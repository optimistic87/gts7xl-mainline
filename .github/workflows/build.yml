name: Build kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    timeout-minutes: 120
    env:
      LOCALVERSION: ""
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CC: aarch64-linux-gnu-gcc
      GH_REPO: ${{ github.repository }}
      CCACHE_DIR: /github/workspace/.ccache
      CCACHE_MAXSIZE: 5G
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-gts7xl-${{ github.run_id }}
          restore-keys: |
            ccache-gts7xl-

      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ccache build-essential bc bison flex libssl-dev \
            libelf-dev device-tree-compiler cpio kmod git curl bzip2 python3 gh ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross clang lld
          BB1="busybox"
          BB2=".net/downloads/busybox-1.36.1.tar.bz2"
          curl -fsSL "https://${BB1}${BB2}" -o /tmp/bb.tar.bz2
          tar -xjf /tmp/bb.tar.bz2 -C /tmp
          make -C /tmp/busybox-1.36.1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/; s/CONFIG_TC=y/# CONFIG_TC is not set/' /tmp/busybox-1.36.1/.config
          make -C /tmp/busybox-1.36.1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" busybox
          install -m755 /tmp/busybox-1.36.1/busybox /usr/local/lib/busybox-arm64
          MK1="android.googlesource"
          MK2=".com/platform/system/tools/mkbootimg"
          git clone --depth 1 "https://${MK1}${MK2}" mkbootimg-src
          update-ccache-symlinks
          echo /usr/lib/ccache >> "$GITHUB_PATH"

      - name: Build the GNSS helpers
        run: make -C gnss install DESTDIR="$PWD/rootfs/overlay"

      - name: Fetch Linux v7.3 and apply patches
        run: |
          K1="git.kernel"
          K2=".org/pub/scm/linux/kernel/git/stable/linux.git"
          git clone --depth 1 --branch v7.3 "https://${K1}${K2}" linux
          cd linux
          git config user.name ci
          git config user.email ci@example.invalid
          git am ../linux-patches/*.patch

      - name: Assemble the initramfs
        run: |
          I="$PWD/initramfs-root"
          mkdir -p "$I"/bin "$I"/dev "$I"/proc "$I"/sys "$I"/tmp "$I"/mnt
          install -m755 initramfs/init "$I"/init
          install -m755 /usr/local/lib/busybox-arm64 "$I"/bin/busybox
          "$CC" -static -O2 -o "$I"/bin/usbroute tools/usbroute.c
          "$CC" -static -O2 -o "$I"/bin/reboot-recovery tools/rr.c
          echo "INITRAMFS=$I" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          cd linux
          cp ../config/gts7xl_defconfig arch/arm64/configs/gts7xl_defconfig
          make O=build gts7xl_defconfig
          scripts/config --file build/.config --set-str INITRAMFS_SOURCE "$INITRAMFS"
          make O=build olddefconfig
          test "$(make -s O=build kernelrelease)" = 7.3.0-gts7xl
          make -s O=build -j"$(nproc)" Image modules qcom/sm8250-samsung-gts7xlwifi.dtb
          make -s O=build INSTALL_MOD_PATH="$PWD/../modroot" INSTALL_MOD_STRIP=1 modules_install
          ccache -s | grep -iE 'hits|misses' || true
          tar -C ../modroot -czf ../modules.tar.gz lib
          ../rootfs/stage1/assemble.sh build "$INITRAMFS" aarch64-linux-gnu-strip
          ../rootfs/stage2/build.sh "$INITRAMFS/s1/s1ui" ../modules.tar.gz ../stage2.tar.gz
          TAG="installer-${GITHUB_RUN_ID}"
          echo "https://${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/releases/download/$TAG/stage2.tar.gz" > "$INITRAMFS/s1/stage2.url"
          sha256sum ../stage2.tar.gz | cut -d' ' -f1 > "$INITRAMFS/s1/stage2.sha256"
          stat -c %s ../stage2.tar.gz > "$INITRAMFS/s1/stage2.size"
          make -s O=build -j"$(nproc)" Image

      - name: Package
        run: |
          mkdir -p artifact
          gzip -9c linux/build/arch/arm64/boot/Image > kernel.gz
          cat kernel.gz linux/build/arch/arm64/boot/dts/qcom/sm8250-samsung-gts7xlwifi.dtb > kernel-dtb
          printf '\0' > rd
          python3 mkbootimg-src/mkbootimg.py --header_version 1 --pagesize 2048 --base 0x10000000 \
            --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 \
            --kernel kernel-dtb --ramdisk rd -o artifact/boot.img
          cp modules.tar.gz artifact/modules-7.3.0-gts7xl.tar.gz
          (cd artifact && sha256sum boot.img modules-7.3.0-gts7xl.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: gts7xlwifi-boot
          path: artifact
          retention-days: 90
